<!-- Modal de Confirmação Genérico -->
<div id="confirmModal" class="modal" style="display: none;" data-cy="modal-confirm">
    <div class="modal-content modal-confirm-content" data-cy="modal-confirm-content">
        <div class="modal-header modal-header-alert" data-cy="modal-confirm-header">
            <h2 class="modal-title" id="confirmModalTitle" data-cy="modal-confirm-title">Confirmar</h2>
            <span class="close" onclick="closeConfirmModal()" data-cy="modal-confirm-close">&times;</span>
        </div>
        <div class="modal-body modal-confirm-body" data-cy="modal-confirm-body">
            <p id="confirmModalMessage" data-cy="modal-confirm-message">Tem certeza que deseja continuar?</p>
            <div id="confirmModalWarning" class="warning-message" style="display: none;" data-cy="modal-confirm-warning"></div>
        </div>
        <div class="modal-footer modal-confirm-footer" data-cy="modal-confirm-footer">
            <button class="btn-cancel" onclick="closeConfirmModal()" data-cy="btn-cancel-confirm">Cancelar</button>
            <button class="btn-confirm" id="btn-confirm-action" onclick="executeConfirmAction()" data-cy="btn-confirm-action">Confirmar</button>
        </div>
    </div>
</div>
